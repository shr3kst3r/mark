# Run with `just lint` (or `pre-commit run --all-files`).
# Install the git hook once with `just hooks` (or `pre-commit install`).
#
# Hooks here are the fast subset. `just check` is the real gate: it also runs
# the test suite and a release build, which are too slow for every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown fixtures use trailing whitespace meaningfully (hard breaks),
        # and the ADR corpus is immutable once accepted.
        #
        # The markdown reference is a fixture in every sense that matters here:
        # its line-break section *demonstrates* the two-space hard break, so
        # stripping it would delete the thing the section is about and leave the
        # page teaching something false.
        exclude: ^(docs/adrs/|core/tests/fixtures/|app/Resources/markdown-reference\.md$)
      - id: end-of-file-fixer
        exclude: ^docs/adrs/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=256]
        # The app and document icons are deliberately committed artwork, and an
        # `.icns` carrying a 1024x1024 representation is ~430 KB — normal for
        # the format, and required: the 1024 image is what Finder's Get Info
        # and a Retina Quick Look actually draw. This hook exists to catch the
        # *accidental* blob (a build output, a corpus, a stray archive), so the
        # 256 KB limit stays in force everywhere else rather than being raised
        # for everything to accommodate two files.
        #
        # They are reproducible rather than opaque: `scripts/make-icons.swift`
        # draws them and `just icons` regenerates them.
        exclude: ^packaging/.*\.icns$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # A stale INDEX.md is a corpus that lies about itself, so it fails the
      # commit rather than being silently regenerated.
      - id: adr-index
        name: ADR INDEX.md is current
        entry: just adr-check
        language: system
        files: ^docs/adrs/
        pass_filenames: false
