selection  = "base02"  # selection background
muted      = "base03"  # comments, dimmed rows, rules
subtle     = "base04"  # secondary text
foreground = "base05"  # body text
heading    = "base0D"  # headings
link       = "base0D"  # links
accent     = "base0E"  # blockquote rule, checkbox tint
