name = "solarized-light"
kind = "light"
pair = "solarized-dark"
title = "Solarized Light"
author = "Ethan Schoonover (modified by aramisgithub)"

[palette]
base00 = "#fdf6e3"
base01 = "#eee8d5"
base02 = "#93a1a1"
base03 = "#839496"
base04 = "#657b83"
base05 = "#586e75"
base06 = "#073642"
base07 = "#002b36"
base08 = "#dc322f"
base09 = "#cb4b16"
base0A = "#b58900"
base0B = "#859900"
base0C = "#2aa198"
base0D = "#268bd2"
base0E = "#6c71c4"
base0F = "#d33682"

# Chrome, as palette slots. Change base0D here and links,
# headings, and the table header rule all move together.
[document]
background = "base00"  # page background
surface    = "base01"  # code blocks, inline code, table headers
selection  = "base02"  # selection background
muted      = "base03"  # comments, dimmed rows, rules
subtle     = "base04"  # secondary text
foreground = "base05"  # body text
heading    = "base0D"  # headings
link       = "base0D"  # links
accent     = "base0E"  # blockquote rule, checkbox tint
rule       = "base02"  # table and horizontal rules
error      = "base08"  # failed-construct badges
warning    = "base0A"
success    = "base0B"
